<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 📱 PWA -->
    <meta name="theme-color" content="#0a1929">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SAO Chalupa">
    <link rel="manifest" href="manifest.json">

    <!-- 🌐 Open Graph (preview en WhatsApp) -->
    <meta property="og:title" content="SAO Control · La Chalupa">
    <meta property="og:description" content="Control de servicios musicales · TOTAL FEST">
    <meta property="og:type" content="website">

    <!-- 🎨 Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">

    <!-- 🏷️ Título -->
    <title>SAO Control · La Chalupa</title>

    <!-- 🎨 ESTILOS (Variables CSS - Paleta TOTAL FEST) -->
    <style>
        :root {
            --fondo: #0a1929;
            --card: #132f4c;
            --azul: #1976d2;
            --azul-claro: #64b5f6;
            --morado: #8e24aa;
            --verde: #4caf50;
            --amarillo: #ffca28;
            --rojo: #ef5350;
            --blanco: #ffffff;
            --gris: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--fondo);
            color: var(--blanco);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        /* 📱 PANTALLAS: solo se ve la que tiene la clase "activa" */
        .pantalla {
            display: none;
            animation: aparecer 0.25s ease;
        }
        .pantalla.activa {
            display: block;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🧭 BARRA DE NAVEGACIÓN INFERIOR */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(19, 47, 76, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-top: 1px solid rgba(100, 181, 246, 0.25);
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--gris);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
        }
        .nav-btn .nav-icono { font-size: 22px; }
        .nav-btn.activo { color: var(--azul-claro); }       
        /* 💰 SALDO GIGANTE */
        .saldo-gigante {
            font-size: 3em;
            font-weight: bold;
            margin-top: 4px;
        }

        /* 📊 RESUMEN */
        .resumen-grid {
            display: flex;
            gap: 12px;
        }
        .resumen-item {
            flex: 1;
            background: rgba(10, 25, 41, 0.5);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .resumen-numero { font-size: 1.3em; font-weight: bold; }
        .resumen-label { color: var(--gris); font-size: 0.8em; margin-top: 4px; }

        /* 🎯 BOTONES DE ACCIÓN RÁPIDA */
        .acciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-accion {
            border: none;
            border-radius: 16px;
            padding: 20px 12px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .btn-morado { background: linear-gradient(135deg, var(--morado), #6a1b9a); }
        .btn-verde { background: linear-gradient(135deg, var(--verde), #2e7d32); }

        /* 🍞 TOAST (mensaje flotante, reemplaza al alert) */
        #toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--card);
            border: 1px solid var(--azul-claro);
            color: var(--blanco);
            padding: 12px 24px;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 200;
            font-size: 0.9em;
            white-space: nowrap;
        }
        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }        
    </style>
</head>
<body>

    <!-- 🏠 PANTALLA: HOME (la dibuja el JavaScript con los datos reales) -->
    <div id="pantalla-home" class="pantalla activa">
        <div id="home-contenido"></div>
    </div>
            <p style="margin-top: 16px;">🚧 Aquí va el saldo pendiente (próximo paso)</p>
        </div>
    </div>

    <!-- 🎤 PANTALLA: SERVICIO -->
    <div id="pantalla-servicio" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">🎤 Registrar Servicio</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 💵 PANTALLA: PAGO -->
    <div id="pantalla-pago" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">💵 Registrar Pago</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 📋 PANTALLA: HISTORIAL -->
    <div id="pantalla-historial" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">📋 Historial</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 📄 PANTALLA: REPORTE -->
    <div id="pantalla-reporte" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">📄 Reporte</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>
    
    <!-- 🍞 Toast -->
    <div id="toast"></div>
    <!-- 🧭 BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <button class="nav-btn activo" onclick="irA('home', this)">
            <span class="nav-icono">🏠</span>Inicio
        </button>
        <button class="nav-btn" onclick="irA('servicio', this)">
            <span class="nav-icono">🎤</span>Servicio
        </button>
        <button class="nav-btn" onclick="irA('pago', this)">
            <span class="nav-icono">💵</span>Pago
        </button>
        <button class="nav-btn" onclick="irA('historial', this)">
            <span class="nav-icono">📋</span>Historial
        </button>
        <button class="nav-btn" onclick="irA('reporte', this)">
            <span class="nav-icono">📄</span>Reporte
        </button>
    </nav>
    
    <!-- 🧠 CEREBRO: datos + funciones base -->
    <script>
        // 📦 EL CUADERNO: aquí viven tus servicios y pagos
        let DATA_APP = {
            servicios: [],  // cada uno: { id, fecha, tipo, horaInicio, horaFin, horas, costo }
            pagos: []       // cada uno: { id, fecha, monto }
        };

        // 💾 LEER del estante (localStorage)
        function cargarDatos() {
            const guardado = localStorage.getItem('saoChalupaData');
            if (guardado) {
                try { DATA_APP = JSON.parse(guardado); }
                catch (e) { console.log('Datos ilegibles, empezamos de cero'); }
            }
        }

        // 💾 GUARDAR en el estante
        function guardarDatos() {
            localStorage.setItem('saoChalupaData', JSON.stringify(DATA_APP));
        }

        // 💰 Calcular totales
        function calcularTotales() {
            const totalServicios = DATA_APP.servicios.reduce((suma, s) => suma + s.costo, 0);
            const totalPagos = DATA_APP.pagos.reduce((suma, p) => suma + p.monto, 0);
            return { totalServicios, totalPagos, saldo: totalServicios - totalPagos };
        }

        // 💵 1100 → "$1,100"
        function formatearDinero(n) {
            return '$' + n.toLocaleString('es-MX');
        }

        // 📅 "2026-08-06" → "Jueves 06/Ago"
        function formatearFecha(fechaISO) {
            const [y, m, d] = fechaISO.split('-').map(Number);
            const fecha = new Date(y, m - 1, d, 12, 0, 0); // mediodía: evita el bug del día anterior
            const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            return dias[fecha.getDay()] + ' ' + String(d).padStart(2, '0') + '/' + meses[fecha.getMonth()];
        }

        // 📅 Fecha de hoy en formato ISO
        function hoyISO() {
            const f = new Date();
            return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
        }

        // 🔊 Sonido "ding" al guardar
        function sonarDing() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gan = ctx.createGain();
                osc.connect(gan);
                gan.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gan.gain.setValueAtTime(0.3, ctx.currentTime);
                gan.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        // 📳 Vibración
        function vibrar() {
            if (navigator.vibrate) navigator.vibrate(80);
        }

        // 🍞 Mostrar toast
        function mostrarToast(texto) {
            const t = document.getElementById('toast');
            t.textContent = texto;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2500);
        }

        // 🏠 DIBUJAR EL HOME
        function renderHome() {
            const { totalServicios, totalPagos, saldo } = calcularTotales();
            const cont = document.getElementById('home-contenido');

            const ultimoServicio = DATA_APP.servicios.length
                ? [...DATA_APP.servicios].sort((a, b) => b.fecha.localeCompare(a.fecha))[0] : null;
            const ultimoPago = DATA_APP.pagos.length
                ? [...DATA_APP.pagos].sort((a, b) => b.fecha.localeCompare(a.fecha))[0] : null;

            let html = '';

            // 💰 El saldo GIGANTE
            if (saldo > 0) {
                html += `
                <div class="card" style="border: 2px solid var(--rojo); text-align: center;">
                    <p style="color: var(--gris); font-size: 0.9em;">🔴 SALDO PENDIENTE</p>
                    <p class="saldo-gigante" style="color: var(--rojo);">${formatearDinero(saldo)}</p>
                </div>`;
            } else {
                html += `
                <div class="card" style="border: 2px solid var(--verde); text-align: center;">
                    <p style="color: var(--gris); font-size: 0.9em;">🟢 TODO LIQUIDADO</p>
                    <p class="saldo-gigante" style="color: var(--verde);">$0</p>
                    <p style="color: var(--gris); font-size: 0.85em;">Jesús está al corriente 🎉</p>
                </div>`;
            }

            // 📊 Resumen
            html += `
            <div class="card">
                <div class="resumen-grid">
                    <div class="resumen-item">
                        <p class="resumen-numero" style="color: var(--azul-claro);">${formatearDinero(totalServicios)}</p>
                        <p class="resumen-label">Total servicios</p>
                    </div>
                    <div class="resumen-item">
                        <p class="resumen-numero" style="color: var(--verde);">${formatearDinero(totalPagos)}</p>
                        <p class="resumen-label">Pagos recibidos</p>
                    </div>
                </div>
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(100,181,246,0.15); color: var(--gris); font-size: 0.85em; line-height: 1.7;">
                    🎤 ${ultimoServicio ? 'Último servicio: ' + formatearFecha(ultimoServicio.fecha) : 'Sin servicios registrados aún'}<br>
                    💵 ${ultimoPago ? 'Último pago: ' + formatearFecha(ultimoPago.fecha) + ' · ' + formatearDinero(ultimoPago.monto) : 'Sin pagos registrados aún'}
                </div>
            </div>`;

            // 🎯 Botones de acción rápida
            html += `
            <div class="acciones-grid">
                <button class="btn-accion btn-morado" onclick="irADesde('servicio')">
                    <span style="font-size: 2em;">🎤</span>
                    <span>Registrar Servicio</span>
                </button>
                <button class="btn-accion btn-verde" onclick="irADesde('pago')">
                    <span style="font-size: 2em;">💵</span>
                    <span>Registrar Pago</span>
                </button>
            </div>`;

            cont.innerHTML = html;
        }

        // 🧭 Ir a una pantalla desde un botón fuera de la barra
        function irADesde(nombre) {
            const mapa = { home: 0, servicio: 1, pago: 2, historial: 3, reporte: 4 };
            irA(nombre, document.querySelectorAll('.nav-btn')[mapa[nombre]]);
        }

        // 🚀 ARRANQUE
        cargarDatos();
        renderHome();
    </script>
    <!-- 🧠 JAVASCRIPT: navegación entre pantallas -->
    <script>
        function irA(nombre, boton) {
            // Ocultar todas las pantallas
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            // Mostrar la elegida
            document.getElementById('pantalla-' + nombre).classList.add('activa');
            // Marcar el botón activo en la barra
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activo'));
            boton.classList.add('activo');
            // Scroll hacia arriba
            window.scrollTo(0, 0);
        }
    </script>
    
    <!-- 🛡️ ACTIVAR SERVICE WORKER (modo offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registro) => {
                        console.log('✅ Service Worker activo');
                    })
                    .catch((error) => {
                        console.log('❌ Error con el SW:', error);
                    });
            });
        }
    </script>
</body>
</html>
