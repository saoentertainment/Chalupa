<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 📱 PWA -->
    <meta name="theme-color" content="#0a1929">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SAO Chalupa">
    <link rel="manifest" href="manifest.json">

    <!-- 🌐 Open Graph (preview en WhatsApp) -->
    <meta property="og:title" content="SAO Control · La Chalupa">
    <meta property="og:description" content="Control de servicios musicales · TOTAL FEST">
    <meta property="og:type" content="website">

    <!-- 🎨 Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">

    <!-- 🏷️ Título -->
    <title>SAO Control · La Chalupa</title>

    <!-- 🎨 ESTILOS (Variables CSS - Paleta TOTAL FEST) -->
    <style>
        :root {
            --fondo: #0a1929;
            --card: #132f4c;
            --azul: #1976d2;
            --azul-claro: #64b5f6;
            --morado: #8e24aa;
            --verde: #4caf50;
            --amarillo: #ffca28;
            --rojo: #ef5350;
            --blanco: #ffffff;
            --gris: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--fondo);
            color: var(--blanco);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        /* 📱 PANTALLAS: solo se ve la que tiene la clase "activa" */
        .pantalla {
            display: none;
            animation: aparecer 0.25s ease;
        }
        .pantalla.activa {
            display: block;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🧭 BARRA DE NAVEGACIÓN INFERIOR */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(19, 47, 76, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-top: 1px solid rgba(100, 181, 246, 0.25);
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--gris);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
        }
        .nav-btn .nav-icono { font-size: 22px; }
        .nav-btn.activo { color: var(--azul-claro); }       
        /* 💰 SALDO GIGANTE */
        .saldo-gigante {
            font-size: 3em;
            font-weight: bold;
            margin-top: 4px;
        }

        /* 📊 RESUMEN */
        .resumen-grid {
            display: flex;
            gap: 12px;
        }
        .resumen-item {
            flex: 1;
            background: rgba(10, 25, 41, 0.5);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .resumen-numero { font-size: 1.3em; font-weight: bold; }
        .resumen-label { color: var(--gris); font-size: 0.8em; margin-top: 4px; }

        /* 🎯 BOTONES DE ACCIÓN RÁPIDA */
        .acciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-accion {
            border: none;
            border-radius: 16px;
            padding: 20px 12px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .btn-morado { background: linear-gradient(135deg, var(--morado), #6a1b9a); }
        .btn-verde { background: linear-gradient(135deg, var(--verde), #2e7d32); }

        /* 🍞 TOAST (mensaje flotante, reemplaza al alert) */
        #toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--card);
            border: 1px solid var(--azul-claro);
            color: var(--blanco);
            padding: 12px 24px;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 200;
            font-size: 0.9em;
            white-space: nowrap;
        }
        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        } 
        /* 📝 FORMULARIOS */
        .form-grupo { margin-bottom: 16px; }
        .form-label {
            display: block;
            color: var(--gris);
            font-size: 0.85em;
            margin-bottom: 6px;
        }
        .form-input, .form-select {
            width: 100%;
            background: rgba(10, 25, 41, 0.6);
            border: 1px solid rgba(100, 181, 246, 0.3);
            border-radius: 10px;
            color: var(--blanco);
            font-size: 1.1em;
            padding: 12px;
            outline: none;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--azul-claro);
        }
        .form-select option { background: var(--card); }
        input[type="date"], input[type="time"] { color-scheme: dark; }
        .btn-guardar {
            width: 100%;
            background: linear-gradient(135deg, var(--verde), #2e7d32);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.15em;
            font-weight: bold;
            padding: 16px;
            cursor: pointer;
        }   
        /* 💵 PANTALLA PAGO */
        .monto-grande {
            font-size: 1.6em !important;
            font-weight: bold;
            text-align: center;
        }
        .chip {
            flex: 1;
            background: rgba(25, 118, 210, 0.2);
            border: 1px solid var(--azul);
            color: var(--azul-claro);
            border-radius: 20px;
            padding: 10px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
        }
        .chip:active { background: rgba(25, 118, 210, 0.5); } 
        /* 📋 HISTORIAL */
        .hist-item { padding: 14px; }
        .btn-borrar {
            background: rgba(239, 83, 80, 0.15);
            border: 1px solid var(--rojo);
            color: var(--rojo);
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 1em;
            flex-shrink: 0;
            margin-left: 8px;
        }        
    </style>
</head>
<body>

    <!-- 🏠 PANTALLA: HOME (la dibuja el JavaScript con los datos reales) -->
    <div id="pantalla-home" class="pantalla activa">
        <div id="home-contenido"></div>
    </div>
            <p style="margin-top: 16px;">🚧 Aquí va el saldo pendiente (próximo paso)</p>
        </div>
    </div>

    <!-- 🎤 PANTALLA: SERVICIO -->
    <div id="pantalla-servicio" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro); margin-bottom: 16px;">🎤 Registrar Servicio</h2>

            <div class="form-grupo">
                <label class="form-label">📅 Fecha del servicio</label>
                <input type="date" id="sv-fecha" class="form-input">
            </div>

            <div class="form-grupo">
                <label class="form-label">🎯 Tipo de servicio</label>
                <select id="sv-tipo" class="form-select">
                    <option value="Karaoke">🎤 Karaoke</option>
                    <option value="Música en Vivo">🎸 Música en Vivo</option>
                    <option value="Evento Especial">🎉 Evento Especial</option>
                </select>
            </div>

            <div style="display: flex; gap: 12px;">
                <div class="form-grupo" style="flex: 1;">
                    <label class="form-label">🌇 Inicio</label>
                    <input type="time" id="sv-inicio" class="form-input" value="20:00" onchange="actualizarHoras()">
                </div>
                <div class="form-grupo" style="flex: 1;">
                    <label class="form-label">🌙 Fin</label>
                    <input type="time" id="sv-fin" class="form-input" value="01:00" onchange="actualizarHoras()">
                </div>
            </div>

            <div style="background: rgba(142, 36, 170, 0.15); border: 1px solid var(--morado); border-radius: 12px; padding: 12px; text-align: center;">
                <p style="color: var(--gris); font-size: 0.85em;">⏱️ Horas trabajadas</p>
                <p id="sv-horas" style="font-size: 2em; font-weight: bold; color: var(--azul-claro);">5 hrs</p>
            </div>

            <div class="form-grupo" style="margin-top: 16px;">
                <label class="form-label">💰 Costo del servicio ($)</label>
                <input type="number" id="sv-costo" class="form-input" value="1100" min="0" inputmode="numeric">
            </div>

            <button class="btn-guardar" onclick="guardarServicio()">💾 GUARDAR SERVICIO</button>
        </div>
    </div>

    <!-- 💵 PANTALLA: PAGO -->
    <div id="pantalla-pago" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro); margin-bottom: 16px;">💵 Registrar Pago</h2>

            <div class="form-grupo">
                <label class="form-label">📅 Fecha del pago</label>
                <input type="date" id="pg-fecha" class="form-input">
            </div>

            <div class="form-grupo">
                <label class="form-label">💰 Monto recibido ($)</label>
                <input type="number" id="pg-monto" class="form-input monto-grande" min="0" inputmode="numeric" placeholder="0" oninput="previsualizarPago()">
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <button class="chip" onclick="setMonto(550)">$550</button>
                <button class="chip" onclick="setMonto(1100)">$1,100</button>
                <button class="chip" onclick="setMonto(2200)">$2,200</button>
            </div>

            <div class="form-grupo">
                <label class="form-label">📝 Nota (opcional)</label>
                <input type="text" id="pg-nota" class="form-input" placeholder="Ej: pago semanal, adelanto...">
            </div>

            <div style="background: rgba(76, 175, 80, 0.12); border: 1px solid var(--verde); border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 16px;">
                <p id="pg-preview" style="color: var(--blanco); font-size: 0.95em;"></p>
            </div>

            <button class="btn-guardar" onclick="guardarPago()">💾 GUARDAR PAGO</button>
        </div>
    </div>

    <!-- 📋 PANTALLA: HISTORIAL -->
    <div id="pantalla-historial" class="pantalla">
        <h2 style="color: var(--azul-claro); margin-bottom: 12px;">📋 Historial de Movimientos</h2>
        <div id="historial-contenido"></div>
    </div>

    <!-- 📄 PANTALLA: REPORTE -->
    <div id="pantalla-reporte" class="pantalla">
        <h2 style="color: var(--azul-claro); margin-bottom: 12px;">📄 Reporte para Jesús</h2>

        <div class="card">
            <label class="form-label">📅 Periodo del reporte</label>
            <div style="display: flex; gap: 12px;">
                <div style="flex: 1;">
                    <label class="form-label">Desde</label>
                    <input type="date" id="rp-desde" class="form-input">
                </div>
                <div style="flex: 1;">
                    <label class="form-label">Hasta</label>
                    <input type="date" id="rp-hasta" class="form-input">
                </div>
            </div>
            <button class="btn-guardar" style="margin-top: 12px; background: linear-gradient(135deg, var(--azul), #0d47a1);" onclick="renderReporte()">🔄 Actualizar reporte</button>
        </div>

        <div class="card" style="background: rgba(10, 25, 41, 0.6);">
            <pre id="rp-preview" style="white-space: pre-wrap; font-family: inherit; font-size: 0.9em; color: var(--blanco);"></pre>
        </div>

        <div class="acciones-grid">
            <button class="btn-accion btn-verde" onclick="copiarReporte()">
                <span style="font-size: 2em;">📋</span>
                <span>Copiar para WhatsApp</span>
            </button>
            <button class="btn-accion btn-morado" onclick="generarPDF()">
                <span style="font-size: 2em;">🖨️</span>
                <span>Generar PDF</span>
            </button>
        </div>
    </div>
    
    <!-- 🍞 Toast -->
    <div id="toast"></div>
    <!-- 🧭 BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <button class="nav-btn activo" onclick="irA('home', this)">
            <span class="nav-icono">🏠</span>Inicio
        </button>
        <button class="nav-btn" onclick="irA('servicio', this)">
            <span class="nav-icono">🎤</span>Servicio
        </button>
        <button class="nav-btn" onclick="irA('pago', this)">
            <span class="nav-icono">💵</span>Pago
        </button>
        <button class="nav-btn" onclick="irA('historial', this)">
            <span class="nav-icono">📋</span>Historial
        </button>
        <button class="nav-btn" onclick="irA('reporte', this)">
            <span class="nav-icono">📄</span>Reporte
        </button>
    </nav>
    
    <!-- 🧠 CEREBRO: datos + funciones base -->
    <script>
        // 📦 EL CUADERNO: aquí viven tus servicios y pagos
        let DATA_APP = {
            servicios: [],  // cada uno: { id, fecha, tipo, horaInicio, horaFin, horas, costo }
            pagos: []       // cada uno: { id, fecha, monto }
        };

        // 💾 LEER del estante (localStorage)
        function cargarDatos() {
            const guardado = localStorage.getItem('saoChalupaData');
            if (guardado) {
                try { DATA_APP = JSON.parse(guardado); }
                catch (e) { console.log('Datos ilegibles, empezamos de cero'); }
            }
        }

        // 💾 GUARDAR en el estante
        function guardarDatos() {
            localStorage.setItem('saoChalupaData', JSON.stringify(DATA_APP));
        }

        // 💰 Calcular totales
        function calcularTotales() {
            const totalServicios = DATA_APP.servicios.reduce((suma, s) => suma + s.costo, 0);
            const totalPagos = DATA_APP.pagos.reduce((suma, p) => suma + p.monto, 0);
            return { totalServicios, totalPagos, saldo: totalServicios - totalPagos };
        }

        // 💵 1100 → "$1,100"
        function formatearDinero(n) {
            return '$' + n.toLocaleString('es-MX');
        }

        // 📅 "2026-08-06" → "Jueves 06/Ago"
        function formatearFecha(fechaISO) {
            const [y, m, d] = fechaISO.split('-').map(Number);
            const fecha = new Date(y, m - 1, d, 12, 0, 0); // mediodía: evita el bug del día anterior
            const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            return dias[fecha.getDay()] + ' ' + String(d).padStart(2, '0') + '/' + meses[fecha.getMonth()];
        }

        // 📅 Fecha de hoy en formato ISO
        function hoyISO() {
            const f = new Date();
            return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
        }

        // 🔊 Sonido "ding" al guardar
        function sonarDing() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gan = ctx.createGain();
                osc.connect(gan);
                gan.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gan.gain.setValueAtTime(0.3, ctx.currentTime);
                gan.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        // 📳 Vibración
        function vibrar() {
            if (navigator.vibrate) navigator.vibrate(80);
        }

        // 🍞 Mostrar toast
        function mostrarToast(texto) {
            const t = document.getElementById('toast');
            t.textContent = texto;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2500);
        }

        // 🏠 DIBUJAR EL HOME
        function renderHome() {
            const { totalServicios, totalPagos, saldo } = calcularTotales();
            const cont = document.getElementById('home-contenido');

            const ultimoServicio = DATA_APP.servicios.length
                ? [...DATA_APP.servicios].sort((a, b) => b.fecha.localeCompare(a.fecha))[0] : null;
            const ultimoPago = DATA_APP.pagos.length
                ? [...DATA_APP.pagos].sort((a, b) => b.fecha.localeCompare(a.fecha))[0] : null;

            let html = '';

            // 💰 El saldo GIGANTE
            if (saldo > 0) {
                html += `
                <div class="card" style="border: 2px solid var(--rojo); text-align: center;">
                    <p style="color: var(--gris); font-size: 0.9em;">🔴 SALDO PENDIENTE</p>
                    <p class="saldo-gigante" style="color: var(--rojo);">${formatearDinero(saldo)}</p>
                </div>`;
            } else {
                html += `
                <div class="card" style="border: 2px solid var(--verde); text-align: center;">
                    <p style="color: var(--gris); font-size: 0.9em;">🟢 TODO LIQUIDADO</p>
                    <p class="saldo-gigante" style="color: var(--verde);">$0</p>
                    <p style="color: var(--gris); font-size: 0.85em;">${saldo < 0 ? 'Saldo a favor de Jesús: ' + formatearDinero(Math.abs(saldo)) : 'Jesús está al corriente 🎉'}</p>
                </div>`;
            }

            // 📊 Resumen
            html += `
            <div class="card">
                <div class="resumen-grid">
                    <div class="resumen-item">
                        <p class="resumen-numero" style="color: var(--azul-claro);">${formatearDinero(totalServicios)}</p>
                        <p class="resumen-label">Total servicios</p>
                    </div>
                    <div class="resumen-item">
                        <p class="resumen-numero" style="color: var(--verde);">${formatearDinero(totalPagos)}</p>
                        <p class="resumen-label">Pagos recibidos</p>
                    </div>
                </div>
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(100,181,246,0.15); color: var(--gris); font-size: 0.85em; line-height: 1.7;">
                    🎤 ${ultimoServicio ? 'Último servicio: ' + formatearFecha(ultimoServicio.fecha) : 'Sin servicios registrados aún'}<br>
                    💵 ${ultimoPago ? 'Último pago: ' + formatearFecha(ultimoPago.fecha) + ' · ' + formatearDinero(ultimoPago.monto) : 'Sin pagos registrados aún'}
                </div>
            </div>`;

            // 🎯 Botones de acción rápida
            html += `
            <div class="acciones-grid">
                <button class="btn-accion btn-morado" onclick="irADesde('servicio')">
                    <span style="font-size: 2em;">🎤</span>
                    <span>Registrar Servicio</span>
                </button>
                <button class="btn-accion btn-verde" onclick="irADesde('pago')">
                    <span style="font-size: 2em;">💵</span>
                    <span>Registrar Pago</span>
                </button>
            </div>`;

            cont.innerHTML = html;
        }

        // 🧭 Ir a una pantalla desde un botón fuera de la barra
        function irADesde(nombre) {
            const mapa = { home: 0, servicio: 1, pago: 2, historial: 3, reporte: 4 };
            irA(nombre, document.querySelectorAll('.nav-btn')[mapa[nombre]]);
        }
        
        // ⏱️ Calcular horas entre inicio y fin (entiende si cruza la medianoche 🌙)
        function calcularHoras(inicio, fin) {
            if (!inicio || !fin) return 0;
            const [hi, mi] = inicio.split(':').map(Number);
            const [hf, mf] = fin.split(':').map(Number);
            let mins = (hf * 60 + mf) - (hi * 60 + mi);
            if (mins <= 0) mins += 24 * 60; // cruzó la medianoche
            return Math.round((mins / 60) * 10) / 10;
        }

        // 🔄 Actualizar las horas en pantalla mientras cambiás los horarios
        function actualizarHoras() {
            const inicio = document.getElementById('sv-inicio').value;
            const fin = document.getElementById('sv-fin').value;
            document.getElementById('sv-horas').textContent = calcularHoras(inicio, fin) + ' hrs';
        }

        // 💾 Guardar un servicio nuevo
        function guardarServicio() {
            const fecha = document.getElementById('sv-fecha').value;
            const tipo = document.getElementById('sv-tipo').value;
            const horaInicio = document.getElementById('sv-inicio').value;
            const horaFin = document.getElementById('sv-fin').value;
            const costo = parseFloat(document.getElementById('sv-costo').value);

            if (!fecha) { mostrarToast('⚠️ Elegí una fecha'); return; }
            if (!horaInicio || !horaFin) { mostrarToast('⚠️ Completá los horarios'); return; }
            if (!costo || costo <= 0) { mostrarToast('⚠️ Poné un costo válido'); return; }

            DATA_APP.servicios.push({
                id: Date.now(),
                fecha: fecha,
                tipo: tipo,
                horaInicio: horaInicio,
                horaFin: horaFin,
                horas: calcularHoras(horaInicio, horaFin),
                costo: costo
            });
            guardarDatos();
            sonarDing();
            vibrar();
            mostrarToast('✅ Servicio guardado');
            renderHome();
            setTimeout(() => irADesde('home'), 1000);
        }

        // 🎬 Preparar el formulario al entrar a la pantalla
        function prepararFormServicio() {
            document.getElementById('sv-fecha').value = hoyISO();
            actualizarHoras();
        }
        // 💵 Poner un monto rápido (los chips)
        function setMonto(valor) {
            document.getElementById('pg-monto').value = valor;
            previsualizarPago();
        }

        // 👀 Mostrar EN VIVO cómo quedará el saldo con este pago
        function previsualizarPago() {
            const monto = parseFloat(document.getElementById('pg-monto').value) || 0;
            const { saldo } = calcularTotales();
            const el = document.getElementById('pg-preview');

            if (monto <= 0) {
                el.innerHTML = '💰 Saldo pendiente actual: <b>' + formatearDinero(saldo) + '</b>';
                return;
            }
            const nuevo = saldo - monto;
            if (nuevo > 0) {
                el.innerHTML = 'Después de este pago quedará: <b style="color: var(--rojo);">' + formatearDinero(nuevo) + '</b>';
            } else if (nuevo === 0) {
                el.innerHTML = '🟢 ¡Con este pago queda <b>LIQUIDADO</b>!';
            } else {
                el.innerHTML = '⚠️ Este pago excede el saldo por <b>' + formatearDinero(Math.abs(nuevo)) + '</b>';
            }
        }

        // 💾 Guardar un pago
        function guardarPago() {
            const fecha = document.getElementById('pg-fecha').value;
            const monto = parseFloat(document.getElementById('pg-monto').value);
            const nota = document.getElementById('pg-nota').value.trim();

            if (!fecha) { mostrarToast('⚠️ Elegí una fecha'); return; }
            if (!monto || monto <= 0) { mostrarToast('⚠️ Poné el monto del pago'); return; }

            DATA_APP.pagos.push({
                id: Date.now(),
                fecha: fecha,
                monto: monto,
                nota: nota
            });
            guardarDatos();
            sonarDing();
            vibrar();
            mostrarToast('💵 Pago registrado');
            renderHome();
            setTimeout(() => irADesde('home'), 1000);
        }

        // 🎬 Preparar el formulario de pago al entrar
        function prepararFormPago() {
            document.getElementById('pg-fecha').value = hoyISO();
            document.getElementById('pg-monto').value = '';
            document.getElementById('pg-nota').value = '';
            previsualizarPago();
        }
         // 🚦 Calcula cuánto se pagó de cada servicio
        // (los pagos cubren primero lo más viejo, como en la vida real)
        function calcularEstados() {
            const ordenados = [...DATA_APP.servicios].sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id - b.id);
            let disponible = DATA_APP.pagos.reduce((suma, p) => suma + p.monto, 0);
            const estados = {};
            ordenados.forEach(sv => {
                let pagado = 0;
                if (disponible >= sv.costo) {
                    pagado = sv.costo;
                    disponible -= sv.costo;
                } else if (disponible > 0) {
                    pagado = disponible;
                    disponible = 0;
                }
                estados[sv.id] = { pagado: pagado, restante: sv.costo - pagado };
            });
            return estados;
        }

        // 📋 Dibujar el historial
        function renderHistorial() {
            const cont = document.getElementById('historial-contenido');
            const estados = calcularEstados();

            if (!DATA_APP.servicios.length && !DATA_APP.pagos.length) {
                cont.innerHTML = '<div class="card" style="text-align: center; color: var(--gris);">📭 Todavía no hay nada registrado.<br>¡Empezá agregando tu primer servicio! 🎤</div>';
                return;
            }

            // Mezclar servicios y pagos, ordenados por fecha (lo nuevo arriba)
            const items = [];
            DATA_APP.servicios.forEach(sv => items.push({ clase: 'servicio', fecha: sv.fecha, id: sv.id, data: sv }));
            DATA_APP.pagos.forEach(pg => items.push({ clase: 'pago', fecha: pg.fecha, id: pg.id, data: pg }));
            items.sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);

            let html = '<p style="color: var(--gris); font-size: 0.85em; text-align: center; margin-bottom: 12px;">📜 ' + items.length + ' movimientos registrados</p>';

            items.forEach(item => {
                if (item.clase === 'servicio') {
                    const sv = item.data;
                    const est = estados[sv.id];
                    let semaforo, borde, estadoHtml;
                    if (est.restante <= 0) {
                        semaforo = '🟢';
                        borde = 'var(--verde)';
                        estadoHtml = '<span style="color: var(--verde);">LIQUIDADO</span>';
                    } else if (est.pagado > 0) {
                        semaforo = '🟡';
                        borde = 'var(--amarillo)';
                        estadoHtml = '<span style="color: var(--amarillo);">Resta: ' + formatearDinero(est.restante) + '</span>';
                    } else {
                        semaforo = '🔴';
                        borde = 'var(--rojo)';
                        estadoHtml = '<span style="color: var(--rojo);">Resta: ' + formatearDinero(est.restante) + '</span>';
                    }

                    html += `
                    <div class="card hist-item" style="border-left: 4px solid ${borde};">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <p style="font-weight: bold;">🎤 ${sv.tipo} ${semaforo}</p>
                                <p style="color: var(--gris); font-size: 0.85em; margin-top: 2px;">${formatearFecha(sv.fecha)} · ${sv.horaInicio} → ${sv.horaFin} · ${sv.horas} hrs</p>
                                <p style="margin-top: 6px;"><b style="color: var(--azul-claro);">${formatearDinero(sv.costo)}</b> · ${estadoHtml}</p>
                            </div>
                            <button class="btn-borrar" onclick="confirmarBorrar('servicio', ${sv.id}, this)">🗑️</button>
                        </div>
                    </div>`;
                } else {
                    const pg = item.data;
                    html += `
                    <div class="card hist-item" style="border-left: 4px solid var(--verde);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <p style="font-weight: bold;">💵 Pago recibido</p>
                                <p style="color: var(--gris); font-size: 0.85em; margin-top: 2px;">${formatearFecha(pg.fecha)}${pg.nota ? ' · ' + pg.nota : ''}</p>
                                <p style="margin-top: 6px;"><b style="color: var(--verde);">+${formatearDinero(pg.monto)}</b></p>
                            </div>
                            <button class="btn-borrar" onclick="confirmarBorrar('pago', ${pg.id}, this)">🗑️</button>
                        </div>
                    </div>`;
                }
            });

            cont.innerHTML = html;
        }

        // 🗑️ Borrar con DOBLE confirmación (sin alerts)
        function confirmarBorrar(clase, id, boton) {
            if (boton.dataset.confirmando === 'si') {
                // Segundo toque: ¡a la basura!
                if (clase === 'servicio') {
                    DATA_APP.servicios = DATA_APP.servicios.filter(s => s.id !== id);
                } else {
                    DATA_APP.pagos = DATA_APP.pagos.filter(p => p.id !== id);
                }
                guardarDatos();
                sonarDing();
                vibrar();
                mostrarToast('🗑️ Eliminado');
                renderHistorial();
                renderHome();
            } else {
                // Primer toque: preguntar
                boton.dataset.confirmando = 'si';
                boton.textContent = '¿Seguro?';
                boton.style.background = 'var(--rojo)';
                boton.style.color = 'white';
                boton.style.fontSize = '0.8em';
                boton.style.padding = '10px 12px';
                // Si no confirma en 3 segundos, se arrepiente solo
                setTimeout(() => {
                    if (boton.dataset.confirmando === 'si') {
                        boton.dataset.confirmando = 'no';
                        boton.textContent = '🗑️';
                        boton.style.background = '';
                        boton.style.color = '';
                        boton.style.fontSize = '';
                        boton.style.padding = '';
                    }
                }, 3000);
            }
        }
         // 📄 Generar el texto del reporte (para WhatsApp y vista previa)
        function generarTextoReporte() {
            const desde = document.getElementById('rp-desde').value;
            const hasta = document.getElementById('rp-hasta').value;

            const servicios = DATA_APP.servicios
                .filter(s => (!desde || s.fecha >= desde) && (!hasta || s.fecha <= hasta))
                .sort((a, b) => a.fecha.localeCompare(b.fecha));
            const pagos = DATA_APP.pagos
                .filter(p => (!desde || p.fecha >= desde) && (!hasta || p.fecha <= hasta))
                .sort((a, b) => a.fecha.localeCompare(b.fecha));

            const totalServicios = servicios.reduce((suma, s) => suma + s.costo, 0);
            const totalPagos = pagos.reduce((suma, p) => suma + p.monto, 0);
            const { saldo } = calcularTotales(); // acumulado TOTAL

            let texto = '';
            texto += '📄 REPORTE DE SERVICIOS\n';
            texto += '🎤 KARAOKE SAO · TOTAL FEST\n';
            texto += 'Cliente: LA CHALUPA LERMA\n';
            texto += "At'n: Jesus Arias Velazco\n\n";
            texto += '📅 Periodo: ' + (desde ? formatearFecha(desde) : 'inicio') + ' al ' + (hasta ? formatearFecha(hasta) : 'hoy') + '\n\n';

            if (servicios.length) {
                texto += '🎤 SERVICIOS:\n';
                servicios.forEach(s => {
                    texto += '• ' + formatearFecha(s.fecha) + ' | ' + s.tipo + ' | ' + s.horaInicio + '–' + s.horaFin + ' | ' + s.horas + ' hrs | ' + formatearDinero(s.costo) + '\n';
                });
            } else {
                texto += '🎤 Sin servicios en este periodo\n';
            }

            if (pagos.length) {
                texto += '\n💵 PAGOS RECIBIDOS:\n';
                pagos.forEach(p => {
                    texto += '• ' + formatearFecha(p.fecha) + ' | ' + formatearDinero(p.monto) + (p.nota ? ' | ' + p.nota : '') + '\n';
                });
            }

            texto += '\n💰 Total servicios del periodo: ' + formatearDinero(totalServicios);
            texto += '\n💵 Pagos del periodo: ' + formatearDinero(totalPagos);

            const hayPrevios = DATA_APP.servicios.some(s => s.fecha < desde) || DATA_APP.pagos.some(p => p.fecha < desde);
            if (saldo > 0) {
                texto += '\n🔴 SALDO PENDIENTE: ' + formatearDinero(saldo);
                if (hayPrevios) texto += ' (incluye arrastre de semanas anteriores)';
            } else if (saldo < 0) {
                texto += '\n🔵 SALDO A FAVOR: ' + formatearDinero(Math.abs(saldo));
            } else {
                texto += '\n🟢 TODO LIQUIDADO · $0';
            }

            texto += '\n\nGenerado: ' + formatearFecha(hoyISO());
            texto += '\nTOTAL FEST · Servicios Musicales';

            return texto;
        }

        // 👀 Mostrar el reporte en pantalla
        function renderReporte() {
            document.getElementById('rp-preview').textContent = generarTextoReporte();
        }

        // 📋 Copiar el reporte para WhatsApp (textarea + execCommand = más compatible)
        function copiarReporte() {
            const texto = generarTextoReporte();
            const ta = document.createElement('textarea');
            ta.value = texto;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                vibrar();
                mostrarToast('📋 Copiado, pegalo en WhatsApp');
            } catch (e) {
                mostrarToast('⚠️ No se pudo copiar');
            }
            document.body.removeChild(ta);
        }

        // 🖨️ Generar PDF profesional imprimible
        function generarPDF() {
            const desde = document.getElementById('rp-desde').value;
            const hasta = document.getElementById('rp-hasta').value;

            const servicios = DATA_APP.servicios
                .filter(s => (!desde || s.fecha >= desde) && (!hasta || s.fecha <= hasta))
                .sort((a, b) => a.fecha.localeCompare(b.fecha));
            const pagos = DATA_APP.pagos
                .filter(p => (!desde || p.fecha >= desde) && (!hasta || p.fecha <= hasta))
                .sort((a, b) => a.fecha.localeCompare(b.fecha));

            const totalServicios = servicios.reduce((suma, s) => suma + s.costo, 0);
            const totalPagos = pagos.reduce((suma, p) => suma + p.monto, 0);
            const { saldo } = calcularTotales();
            const saldoColor = saldo > 0 ? '#c62828' : '#2e7d32';

            let filasServicios = '';
            servicios.forEach((s, i) => {
                filasServicios += '<tr><td>' + (i + 1) + '</td><td>' + formatearFecha(s.fecha) + '</td><td>' + s.tipo + '</td><td>' + s.horaInicio + ' – ' + s.horaFin + '</td><td style="text-align:center;">' + s.horas + '</td><td style="text-align:right;">' + formatearDinero(s.costo) + '</td></tr>';
            });

            let filasPagos = '';
            pagos.forEach(p => {
                filasPagos += '<tr><td>' + formatearFecha(p.fecha) + '</td><td>' + (p.nota || '—') + '</td><td style="text-align:right;">' + formatearDinero(p.monto) + '</td></tr>';
            });

            const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte — TOTAL FEST</title><style>' +
                "* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }" +
                'body { padding: 40px; color: #1a2332; }' +
                '.header { border-bottom: 3px solid #8e24aa; padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }' +
                '.marca h1 { color: #8e24aa; font-size: 22px; }' +
                '.marca p { color: #555; font-size: 13px; }' +
                '.meta { text-align: right; font-size: 13px; color: #555; }' +
                '.cliente { background: #f5f7fa; border-radius: 8px; padding: 14px 18px; margin-bottom: 24px; font-size: 14px; line-height: 1.6; }' +
                'h2 { font-size: 15px; color: #1976d2; margin: 20px 0 8px; text-transform: uppercase; }' +
                'table { width: 100%; border-collapse: collapse; font-size: 13px; }' +
                'th { background: #0a1929; color: #fff; padding: 8px 10px; text-align: left; }' +
                'td { padding: 8px 10px; border-bottom: 1px solid #e0e6ed; }' +
                '.totales { margin-top: 24px; background: #f5f7fa; border-radius: 8px; padding: 18px; max-width: 360px; margin-left: auto; font-size: 14px; }' +
                '.totales div { display: flex; justify-content: space-between; padding: 4px 0; }' +
                '.saldo-final { border-top: 2px solid #0a1929; margin-top: 8px; padding-top: 8px; font-weight: bold; font-size: 16px; color: ' + saldoColor + '; }' +
                '.firmas { display: flex; justify-content: space-around; margin-top: 70px; }' +
                '.firma { text-align: center; font-size: 13px; color: #555; }' +
                '.firma .linea { width: 200px; border-top: 1px solid #333; margin-bottom: 6px; }' +
                '.pie { margin-top: 40px; text-align: center; font-size: 11px; color: #999; }' +
                '@media print { body { padding: 20px; } }' +
                '</style></head><body>' +
                '<div class="header"><div class="marca"><h1>🎤 KARAOKE SAO · TOTAL FEST</h1><p>Servicios Musicales</p></div>' +
                '<div class="meta"><b>REPORTE DE SERVICIOS</b><br>Periodo: ' + (desde ? formatearFecha(desde) : 'inicio') + ' – ' + (hasta ? formatearFecha(hasta) : 'hoy') + '<br>Generado: ' + formatearFecha(hoyISO()) + '</div></div>' +
                '<div class="cliente"><b>Cliente:</b> LA CHALUPA LERMA<br><b>At\'n:</b> Jesus Arias Velazco</div>' +
                '<h2>🎤 Detalle de servicios</h2><table><tr><th>#</th><th>Fecha</th><th>Tipo</th><th>Horario</th><th>Hrs</th><th style="text-align:right;">Costo</th></tr>' +
                (filasServicios || '<tr><td colspan="6" style="text-align:center; color:#999;">Sin servicios en este periodo</td></tr>') + '</table>' +
                '<h2>💵 Pagos recibidos</h2><table><tr><th>Fecha</th><th>Nota</th><th style="text-align:right;">Monto</th></tr>' +
                (filasPagos || '<tr><td colspan="3" style="text-align:center; color:#999;">Sin pagos en este periodo</td></tr>') + '</table>' +
                '<div class="totales"><div><span>Total servicios:</span><b>' + formatearDinero(totalServicios) + '</b></div>' +
                '<div><span>Pagos recibidos:</span><b>' + formatearDinero(totalPagos) + '</b></div>' +
                '<div class="saldo-final"><span>' + (saldo > 0 ? 'SALDO PENDIENTE:' : (saldo < 0 ? 'SALDO A FAVOR:' : 'ESTADO:')) + '</span><span>' + (saldo > 0 ? formatearDinero(saldo) : (saldo < 0 ? formatearDinero(Math.abs(saldo)) : 'LIQUIDADO ✅')) + '</span></div></div>' +
                '<div class="firmas"><div class="firma"><div class="linea"></div>Jesús Arias Velazco<br>LA CHALUPA LERMA</div>' +
                '<div class="firma"><div class="linea"></div>Karaoke SAO<br>TOTAL FEST</div></div>' +
                '<div class="pie">Documento generado por SAO Control · TOTAL FEST · ' + formatearFecha(hoyISO()) + '</div>' +
                '<script>window.onload = function() { window.print(); }<\/script>' +
                '</body></html>';

            const ventana = window.open('', '_blank');
            if (!ventana) {
                mostrarToast('⚠️ Permití ventanas emergentes');
                return;
            }
            ventana.document.write(html);
            ventana.document.close();
        }

        // 🎬 Preparar la pantalla de reporte al entrar
        function prepararFormReporte() {
            const fechas = [
                ...DATA_APP.servicios.map(s => s.fecha),
                ...DATA_APP.pagos.map(p => p.fecha)
            ].sort();
            document.getElementById('rp-desde').value = fechas.length ? fechas[0] : hoyISO();
            document.getElementById('rp-hasta').value = hoyISO();
            renderReporte();
        }       
        // 🚀 ARRANQUE
        cargarDatos();
        renderHome();
    </script>
    <!-- 🧠 JAVASCRIPT: navegación entre pantallas -->
    <script>
        function irA(nombre, boton) {
            // Ocultar todas las pantallas
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            // Mostrar la elegida
            document.getElementById('pantalla-' + nombre).classList.add('activa');
            // Marcar el botón activo en la barra
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activo'));
            if (boton) boton.classList.add('activo');
            // Scroll hacia arriba
            window.scrollTo(0, 0);
            // 🎬 Preparar formularios y refrescar pantallas al entrar
            if (nombre === 'servicio' && typeof prepararFormServicio === 'function') prepararFormServicio();
            if (nombre === 'pago' && typeof prepararFormPago === 'function') prepararFormPago();
            if (nombre === 'historial' && typeof renderHistorial === 'function') renderHistorial(); 
            if (nombre === 'reporte' && typeof prepararFormReporte === 'function') prepararFormReporte();            
            if (nombre === 'home' && typeof renderHome === 'function') renderHome();
        }
    </script>
    
    <!-- 🛡️ ACTIVAR SERVICE WORKER (modo offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registro) => {
                        console.log('✅ Service Worker activo');
                    })
                    .catch((error) => {
                        console.log('❌ Error con el SW:', error);
                    });
            });
        }
    </script>
