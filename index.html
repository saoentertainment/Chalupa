<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 📱 PWA -->
    <meta name="theme-color" content="#0a1929">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SAO Chalupa">
    <link rel="manifest" href="manifest.json">

    <!-- 🌐 Open Graph (preview en WhatsApp) -->
    <meta property="og:title" content="SAO Control · La Chalupa">
    <meta property="og:description" content="Control de servicios musicales · TOTAL FEST">
    <meta property="og:type" content="website">

    <!-- 🎨 Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">

    <!-- 🏷️ Título -->
    <title>SAO Control · La Chalupa</title>

    <!-- 🎨 ESTILOS (Variables CSS - Paleta TOTAL FEST) -->
    <style>
        :root {
            --fondo: #0a1929;
            --card: #132f4c;
            --azul: #1976d2;
            --azul-claro: #64b5f6;
            --morado: #8e24aa;
            --verde: #4caf50;
            --amarillo: #ffca28;
            --rojo: #ef5350;
            --blanco: #ffffff;
            --gris: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--fondo);
            color: var(--blanco);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- 🏠 CONTENIDO (lo llenamos en el Paso 2) -->
    <div class="card">
        <h1 style="color: var(--azul-claro); font-size: 1.4em;">🎤 SAO Control</h1>
        <p style="color: var(--gris); margin-top: 8px;">La Chalupa Lerma · En construcción... 🚧</p>
    </div>
    
    <!-- 🛡️ ACTIVAR SERVICE WORKER (modo offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registro) => {
                        console.log('✅ Service Worker activo');
                    })
                    .catch((error) => {
                        console.log('❌ Error con el SW:', error);
                    });
            });
        }
    </script>
</body>
</html>
