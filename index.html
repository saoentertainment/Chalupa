<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 📱 PWA -->
    <meta name="theme-color" content="#0a1929">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SAO Chalupa">
    <link rel="manifest" href="manifest.json">

    <!-- 🌐 Open Graph (preview en WhatsApp) -->
    <meta property="og:title" content="SAO Control · La Chalupa">
    <meta property="og:description" content="Control de servicios musicales · TOTAL FEST">
    <meta property="og:type" content="website">

    <!-- 🎨 Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">

    <!-- 🏷️ Título -->
    <title>SAO Control · La Chalupa</title>

    <!-- 🎨 ESTILOS (Variables CSS - Paleta TOTAL FEST) -->
    <style>
        :root {
            --fondo: #0a1929;
            --card: #132f4c;
            --azul: #1976d2;
            --azul-claro: #64b5f6;
            --morado: #8e24aa;
            --verde: #4caf50;
            --amarillo: #ffca28;
            --rojo: #ef5350;
            --blanco: #ffffff;
            --gris: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--fondo);
            color: var(--blanco);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        /* 📱 PANTALLAS: solo se ve la que tiene la clase "activa" */
        .pantalla {
            display: none;
            animation: aparecer 0.25s ease;
        }
        .pantalla.activa {
            display: block;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🧭 BARRA DE NAVEGACIÓN INFERIOR */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(19, 47, 76, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-top: 1px solid rgba(100, 181, 246, 0.25);
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--gris);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
        }
        .nav-btn .nav-icono { font-size: 22px; }
        .nav-btn.activo { color: var(--azul-claro); }        
    </style>
</head>
<body>

    <!-- 🏠 PANTALLA: HOME -->
    <div id="pantalla-home" class="pantalla activa">
        <div class="card">
            <h1 style="color: var(--azul-claro); font-size: 1.5em;">🎤 SAO Control</h1>
            <p style="color: var(--gris); margin-top: 4px;">La Chalupa Lerma</p>
            <p style="margin-top: 16px;">🚧 Aquí va el saldo pendiente (próximo paso)</p>
        </div>
    </div>

    <!-- 🎤 PANTALLA: SERVICIO -->
    <div id="pantalla-servicio" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">🎤 Registrar Servicio</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 💵 PANTALLA: PAGO -->
    <div id="pantalla-pago" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">💵 Registrar Pago</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 📋 PANTALLA: HISTORIAL -->
    <div id="pantalla-historial" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">📋 Historial</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 📄 PANTALLA: REPORTE -->
    <div id="pantalla-reporte" class="pantalla">
        <div class="card">
            <h2 style="color: var(--azul-claro);">📄 Reporte</h2>
            <p style="color: var(--gris); margin-top: 8px;">🚧 Próximo paso</p>
        </div>
    </div>

    <!-- 🧭 BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <button class="nav-btn activo" onclick="irA('home', this)">
            <span class="nav-icono">🏠</span>Inicio
        </button>
        <button class="nav-btn" onclick="irA('servicio', this)">
            <span class="nav-icono">🎤</span>Servicio
        </button>
        <button class="nav-btn" onclick="irA('pago', this)">
            <span class="nav-icono">💵</span>Pago
        </button>
        <button class="nav-btn" onclick="irA('historial', this)">
            <span class="nav-icono">📋</span>Historial
        </button>
        <button class="nav-btn" onclick="irA('reporte', this)">
            <span class="nav-icono">📄</span>Reporte
        </button>
    </nav>

    <!-- 🧠 JAVASCRIPT: navegación entre pantallas -->
    <script>
        function irA(nombre, boton) {
            // Ocultar todas las pantallas
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            // Mostrar la elegida
            document.getElementById('pantalla-' + nombre).classList.add('activa');
            // Marcar el botón activo en la barra
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activo'));
            boton.classList.add('activo');
            // Scroll hacia arriba
            window.scrollTo(0, 0);
        }
    </script>
    
    <!-- 🛡️ ACTIVAR SERVICE WORKER (modo offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registro) => {
                        console.log('✅ Service Worker activo');
                    })
                    .catch((error) => {
                        console.log('❌ Error con el SW:', error);
                    });
            });
        }
    </script>
</body>
</html>
